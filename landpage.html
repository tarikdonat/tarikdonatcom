<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönlendiriliyor — Manus-Hermes Gateway</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Manus-Hermes Gateway yönlendirme sayfası.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#667eea">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 2rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            color: #333;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        p {
            color: #555;
            font-size: 1rem;
            margin-bottom: 2rem;
        }
        
        .info {
            background: #f0f4ff;
            padding: 1rem;
            border-radius: 8px;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #555;
        }
        
        .info strong {
            color: #667eea;
        }
        
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        a:hover {
            color: #764ba2;
        }

        a:focus-visible {
            outline: 3px solid #333;
            outline-offset: 3px;
            border-radius: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Yönlendiriliyor...</h1>
        <p>Manus-Hermes Gateway'e bağlanıyorsunuz.</p>
        <p id="countdown" role="status" aria-live="polite">5 saniye içinde yönlendirileceksiniz...</p>
        
        <div class="info">
            <p>Eğer otomatik yönlendirilmezseniz, <a href="#" id="manual-link">buraya tıklayın</a></p>
        </div>
        <noscript><p>Otomatik yönlendirme için JavaScript gerekir. <a href="https://manus-gate-fae6muez.manus.space/api/openai">Gateway'e gitmek için buraya tıklayın</a>.</p></noscript>
    </main>

    <script>
        // URL parametrelerini al
        const urlParams = new URLSearchParams(window.location.search);
        const DEFAULT_URL = 'https://manus-gate-fae6muez.manus.space/api/openai';

        // Güvenlik: yalnızca https ve manus.space alan adlarına yönlendir
        // (aksi halde ?ms=javascript:... veya harici siteye açık yönlendirme olurdu).
        function safeTarget(raw) {
            if (!raw) return DEFAULT_URL;
            try {
                const u = new URL(raw);
                const ok = u.protocol === 'https:' &&
                    (u.hostname === 'manus.space' || u.hostname.endsWith('.manus.space'));
                return ok ? u.href : DEFAULT_URL;
            } catch (e) {
                return DEFAULT_URL;
            }
        }
        const redirectUrl = safeTarget(urlParams.get('ms'));
        
        // Manual link'i ayarla
        document.getElementById('manual-link').href = redirectUrl;
        
        // Geri sayım
        let countdown = 5;
        const countdownEl = document.getElementById('countdown');
        
        const interval = setInterval(() => {
            countdown--;
            if (countdown > 0) {
                countdownEl.textContent = countdown + ' saniye içinde yönlendirileceksiniz...';
            } else {
                clearInterval(interval);
                // Yönlendir
                window.location.replace(redirectUrl);
            }
        }, 1000);
    </script>
</body>
</html>
